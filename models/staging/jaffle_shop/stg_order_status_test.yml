version: 2

models:
  - name: stg_dbt_eaytun__orders
    description: the data grain is one order per data
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - returned
                  - completed
                  - return_pending
                  - shipped
                  - placed
                  - placed_emrah
                  
      - name: customer_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_dbt_eaytun__customers')
                field: customer_id
sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: That is database schema namen in datasoruce
    config:
     freshness:
       warn_after:
         count: 6
         period: hour
       error_after:
         count: 12
         period: hour
     loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        description: Raw data customers table.
        config:
          freshness: null
        columns:
          - name: id
            description: Primary key customer row table
            data_tests:
              - not_null
              - unique
                
                
       
      - name: orders
        description: Raw data orders table.
    

    # dbt source freshness --> komutu ile son yüklemenin freshness durumu kontrol edilir.
    # Freshness en üste koyarsak tüm tanımlı tablolar için bu kontrolü yapar ama ilgili tablonun altına koyarsak sadece onun için yapar!!!!
    # Freshnes önemli son yüklemeden sonra datada güncellenme olmuş mu ona bakıyor aslında
    # 6 saat için warn 12 saat'te bir değişim yok ise o zaman error döndürüyor. bilgi amaçlı bir gösterim.

models:
  - name: stg_dbt_eaytun__customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
         
  - name: stg_dbt_eaytun__orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
  - name: order_status
    data_tests:
      - accepted_values:
          values: 
            - 'returned'
            - 'completed'
            - 'return_pending'
            - 'shipped'
            - 'placed'
            - 'placed_emrah'
                                  